<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação ADM · Neon Void</title>
  <link rel="stylesheet" href="site.css">
  <script defer src="../js/config.js"></script>
  <script defer src="request-admin.js"></script>
</head>
<body>
  <main>
    <p>NEON VOID · SOLICITAÇÃO DE ACESSO</p>
    <h1>Solicitar acesso ADM</h1>
    <p>A solicitação será enviada à conta mestre para análise. Você precisa estar conectado no jogo com uma conta migrada para a nuvem.</p>
    <form id="request-form">
      <label for="reason">Por que você quer ajudar na administração? (20–500 caracteres)</label>
      <textarea id="reason" name="reason" minlength="20" maxlength="500" required></textarea>
      <button type="submit">Enviar solicitação</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
