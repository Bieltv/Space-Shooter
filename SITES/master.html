<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel mestre · Neon Void</title>
  <link rel="stylesheet" href="site.css">
  <script defer src="../js/config.js"></script>
  <script defer src="master.js"></script>
</head>
<body>
  <main>
    <p>NEON VOID · ACESSO RESTRITO</p>
    <h1>Painel mestre</h1>
    <p>O painel usa dois segredos configurados no Worker: o código especial (<code>ACCOUNT_SPECIAL_CODE</code>) e a senha mestre (<code>MASTER_PASSWORD</code>). São credenciais diferentes; não compartilhe nem reutilize sua senha pessoal.</p>
    <form id="login-form">
      <label for="special-code">Código especial</label>
      <input id="special-code" name="code" type="password" autocomplete="off" required>
      <label for="master-password">Senha mestre</label>
      <input id="master-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar no painel</button>
    </form>
    <section id="panel" hidden>
      <div class="actions">
        <button id="refresh-requests" type="button">Atualizar solicitações</button>
        <button id="logout" type="button" class="danger">Sair do painel</button>
      </div>
      <h2>Enviar presente ADM supremo</h2>
      <form id="master-gift-form">
        <label for="gift-recipient">UID Firebase da conta destinatária</label>
        <input id="gift-recipient" name="uid" autocomplete="off" required>
        <label for="master-gift-type">Tipo de presente</label>
        <select id="master-gift-type" name="type">
          <option value="skin">Skin</option>
          <option value="coins">Neon-moedas</option>
          <option value="diamonds">Diamantes</option>
        </select>
        <label id="master-gift-skin-field" for="master-gift-skin">Skin</label>
        <select id="master-gift-skin" name="skinId"></select>
        <label id="master-gift-amount-field" for="master-gift-amount" hidden>Quantidade</label>
        <input id="master-gift-amount" name="amount" type="number" min="1" max="1000000" value="100" hidden>
        <button type="submit">Enviar presente</button>
      </form>
      <p id="gift-status" role="status" aria-live="polite"></p>
      <div id="requests" aria-live="polite"></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
